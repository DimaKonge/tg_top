name: Auto Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tgtop-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Fast Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and build release
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build
      - name: Configure password-based SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST || secrets.VPS_HOST || secrets.HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER || secrets.VPS_USER || secrets.USER || 'root' }}
        run: |
          if [ -z "$SERVER_HOST" ]; then
            echo "::error::GitHub Secret SERVER_HOST (или VPS_HOST) пустой! Добавьте в GitHub: Settings -> Secrets and variables -> Actions -> Secrets (SERVER_HOST, SERVER_USER, SERVER_PASSWORD)"
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          install -d -m 700 ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Upload and activate staged release
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST || secrets.VPS_HOST || secrets.HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER || secrets.VPS_USER || secrets.USER || 'root' }}
          TG_TOP_VPS_PASSWORD: ${{ secrets.SERVER_PASSWORD || secrets.VPS_PASSWORD || secrets.PASSWORD }}
          TG_TOP_VPS_HOST: ${{ (secrets.SERVER_USER || secrets.VPS_USER || secrets.USER || 'root') }}@${{ (secrets.SERVER_HOST || secrets.VPS_HOST || secrets.HOST) }}
          RELEASE_NAME: release-${{ github.sha }}
          TG_TOP_STAGE_PORT: 3101
          SKIP_LOCAL_VERIFY: 1
        run: bash scripts/release-vps.sh

